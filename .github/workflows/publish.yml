name: Publish to Comfy Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Comfy CLI
        run: pip install comfy-cli

      - name: Publish to Registry
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.COMFY_REGISTRY_TOKEN }}
        run: yes N | comfy node publish --token ${{ secrets.COMFY_REGISTRY_TOKEN }}
