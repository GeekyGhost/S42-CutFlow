name: Publish to Comfy Registry

on:
  push:
    branches:
      - main  # Matches the branch in your repository
    tags:
      - 'v*'  # Triggers when you create a version tag
  workflow_dispatch: # Allows you to test it manually from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Comfy CLI
        run: pip install comfy-cli

      - name: Publish to Registry
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.COMFY_REGISTRY_TOKEN }}
        # The 'yes N |' auto-answers NO to the telemetry tracking prompt so the script doesn't freeze
        run: yes N | comfy node publish --token ${{ secrets.COMFY_REGISTRY_TOKEN }} --skip-prompt
