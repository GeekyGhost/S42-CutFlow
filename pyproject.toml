[project]
name = "comfyui-s42-cutflow"
description = "Advanced workflow tools, video transitions, and professional audio utilities for ComfyUI."
version = "1.0.2"
license = { file = "LICENSE.txt" }
readme = "README.md"
keywords = ["comfyui", "image-processing", "masking", "cutflow", "workflow", "audio-processing", "video-editing"]
authors = [
    { name = "Geeky Ghost" }
]
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "Pillow",
    "opencv-python",
    "scipy",
    "rembg",
    "transformers"
]

[project.urls]
Repository = "https://github.com/GeekyGhost/S42-CutFlow"
Issues = "https://github.com/GeekyGhost/S42-CutFlow/issues"

[tool.comfy]
PublisherId = "GeekyGhost" 
DisplayName = "S42 CutFlow"
Icon = "https://raw.githubusercontent.com/GeekyGhost/S42-CutFlow/main/icon.png"
